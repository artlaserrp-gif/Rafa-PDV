<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rafa PDV — Assistência Técnica e Acessórios</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rafa PDV">
<meta name="theme-color" content="#0B0D0C">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0D0C; --panel:#151917; --panel2:#1C211E; --line:#262C28;
  --lime:#8FD838; --lime-dk:#6FB325; --cyan:#4EC9E1; --paper:#F2F6F1; --muted:#93A099;
  --red:#F26D6D; --amber:#F2C14E;
  --r:16px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Nunito Sans',sans-serif; background:var(--ink); color:var(--paper);
  font-size:15px; line-height:1.45;
}
h1,h2,h3,.display{font-family:'Baloo 2',cursive}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{
  font-family:inherit; font-size:15px; width:100%; padding:11px 13px;
  background:var(--panel2); border:1.5px solid var(--line); border-radius:12px; color:var(--paper);
  outline:none; transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--lime)}
label{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin:12px 0 5px; text-transform:uppercase; letter-spacing:.04em}
::placeholder{color:#5A6660}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 20px; border-radius:14px; font-weight:800; font-size:15px;
  background:var(--lime); color:#0B1204; transition:transform .1s, filter .15s;
}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.08)}
.btn.cyan{background:var(--cyan); color:#04252C}
.btn.ghost{background:var(--panel2); color:var(--paper); border:1.5px solid var(--line)}
.btn.danger{background:transparent; color:var(--red); border:1.5px solid var(--red)}
.btn.sm{padding:8px 13px; font-size:13.5px; border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45; cursor:not-allowed}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.tag{display:inline-block; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:800}
.tag.green{background:rgba(143,216,56,.15); color:var(--lime)}
.tag.cyan{background:rgba(78,201,225,.15); color:var(--cyan)}
.tag.red{background:rgba(242,109,109,.15); color:var(--red)}
.tag.amber{background:rgba(242,193,78,.15); color:var(--amber)}
.muted{color:var(--muted)}
.money{font-family:'Baloo 2'; font-weight:700}

/* ---------- AUTH ---------- */
#authScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:radial-gradient(1200px 600px at 80% -10%, rgba(78,201,225,.10), transparent 60%),
             radial-gradient(1000px 700px at -10% 110%, rgba(143,216,56,.10), transparent 60%), var(--ink)}
.authBox{width:100%; max-width:400px}
.authBox .logo{display:block; width:230px; margin:0 auto 8px; border-radius:20px}
.authBox h1{font-size:24px; text-align:center; margin-bottom:2px}
.authBox .sub{text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:18px}
.authTabs{display:flex; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:4px; margin-bottom:16px}
.authTabs button{flex:1; padding:10px; border-radius:11px; font-weight:800; color:var(--muted)}
.authTabs button.on{background:var(--lime); color:#0B1204}

/* ---------- SHELL ---------- */
#app{display:none; min-height:100vh}
.shell{display:flex; min-height:100vh}
aside{
  width:230px; background:var(--panel); border-right:1px solid var(--line);
  padding:18px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px;
}
aside .logo{width:100%; border-radius:16px; margin-bottom:14px}
.navBtn{
  display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:12px;
  font-weight:800; font-size:14.5px; color:var(--muted); width:100%; text-align:left;
}
.navBtn svg{width:20px; height:20px; flex:none}
.navBtn.on{background:var(--panel2); color:var(--lime)}
.navBtn:hover{color:var(--paper)}
aside .spacer{flex:1}
.storeBadge{padding:10px 12px; background:var(--panel2); border-radius:12px; font-size:12.5px; margin-bottom:8px}
.storeBadge b{display:block; font-size:13.5px; color:var(--paper)}
main{flex:1; padding:22px; max-width:1120px; margin:0 auto; width:100%; padding-bottom:96px}
.pageHead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap}
.pageHead h2{font-size:23px}
.pageHead .sub{font-size:13px; color:var(--muted)}

/* bottom nav (mobile) */
#bottomNav{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:rgba(21,25,23,.97); border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
#bottomNav .row{display:flex}
#bottomNav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px; font-size:10.5px; font-weight:800; color:var(--muted); border-radius:10px}
#bottomNav button svg{width:22px; height:22px}
#bottomNav button.on{color:var(--lime)}

/* ---------- PDV ---------- */
.pdvGrid{display:grid; grid-template-columns:1fr 360px; gap:16px; align-items:start}
.prodGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:12px}
.prodCard{
  background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px;
  text-align:left; transition:border-color .15s, transform .1s; display:flex; flex-direction:column; gap:5px;
}
.prodCard:active{transform:scale(.97)}
.prodCard:hover{border-color:var(--lime)}
.prodCard .nm{font-weight:800; font-size:13.5px; line-height:1.25; min-height:34px}
.prodCard .pr{color:var(--lime); font-size:16px}
.prodCard .st{font-size:11.5px}
.cartBox{position:sticky; top:16px}
.cartItems{display:flex; flex-direction:column; gap:8px; max-height:300px; overflow:auto; margin:10px 0}
.cartItem{display:flex; align-items:center; gap:9px; background:var(--panel2); border-radius:12px; padding:9px 11px}
.cartItem .inf{flex:1; min-width:0}
.cartItem .nm{font-weight:800; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cartItem .un{font-size:12px; color:var(--muted)}
.qtyCtl{display:flex; align-items:center; gap:2px}
.qtyCtl button{width:27px; height:27px; border-radius:9px; background:var(--panel); font-weight:900; font-size:15px; color:var(--lime); border:1px solid var(--line)}
.qtyCtl span{min-width:24px; text-align:center; font-weight:800; font-size:13.5px}
.totRow{display:flex; justify-content:space-between; padding:5px 0; font-size:14px}
.totRow.big{font-size:19px; font-weight:800; border-top:1.5px dashed var(--line); margin-top:6px; padding-top:10px}
.payGrid{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:10px 0}
.payBtn{padding:10px 6px; border-radius:12px; background:var(--panel2); border:1.5px solid var(--line); font-weight:800; font-size:13px; color:var(--muted)}
.payBtn.on{border-color:var(--cyan); color:var(--cyan); background:rgba(78,201,225,.08)}

/* ---------- LISTS / TABLE ---------- */
.listRow{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line)}
.listRow:last-child{border-bottom:none}
.listRow .inf{flex:1; min-width:0}
.listRow .nm{font-weight:800; font-size:14.5px}
.listRow .sb{font-size:12.5px; color:var(--muted)}
.searchBar{display:flex; gap:9px}
.searchBar input{flex:1}

/* ---------- STATS ---------- */
.statGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px}
.stat .lb{font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
.stat .vl{font-family:'Baloo 2'; font-size:22px; font-weight:700; margin-top:2px}
.stat.lime .vl{color:var(--lime)} .stat.cyan .vl{color:var(--cyan)} .stat.red .vl{color:var(--red)}

/* ---------- MODAL / TOAST ---------- */
#modalWrap{position:fixed; inset:0; z-index:60; display:none; align-items:flex-end; justify-content:center; background:rgba(4,6,5,.7); backdrop-filter:blur(3px)}
#modalWrap.open{display:flex}
#modalBox{background:var(--panel); border:1px solid var(--line); width:100%; max-width:460px; border-radius:22px 22px 0 0; padding:20px; max-height:88vh; overflow:auto}
#modalBox h3{font-size:19px; margin-bottom:4px}
@media(min-width:720px){ #modalWrap{align-items:center} #modalBox{border-radius:22px} }
#toast{
  position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:86px; z-index:80;
  background:var(--lime); color:#0B1204; font-weight:800; padding:11px 20px; border-radius:99px;
  opacity:0; pointer-events:none; transition:all .25s; font-size:14px; box-shadow:0 8px 30px rgba(0,0,0,.5);
  max-width:90vw; text-align:center;
}
#toast.err{background:var(--red); color:#fff}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

.empty{text-align:center; padding:36px 16px; color:var(--muted)}
.empty .big{font-size:38px; margin-bottom:8px}

/* mobile cart FAB */
#cartFab{display:none; position:fixed; right:16px; bottom:calc(78px + env(safe-area-inset-bottom)); z-index:45;
  background:var(--lime); color:#0B1204; border-radius:99px; padding:14px 20px; font-weight:900; font-size:15px;
  box-shadow:0 10px 30px rgba(143,216,56,.35); align-items:center; gap:8px}
#cartFab .ct{background:#0B1204; color:var(--lime); border-radius:99px; padding:1px 9px; font-size:13px}

@media(max-width:860px){
  aside{display:none}
  #bottomNav{display:block}
  main{padding:16px 14px 110px}
  .pdvGrid{grid-template-columns:1fr}
  .cartBox.desktopOnly{display:none}
  #cartFab.has{display:flex}
  .prodGrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
@media(min-width:861px){ #cartFab{display:none!important} }
</style>
</head>

<script>
/* =================== HELPERS =================== */
const $ = s => document.querySelector(s);
const fmt = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const dstr = ts => new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const dayKey = ts => new Date(ts).toLocaleDateString('pt-BR');
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className=err?'err show':'show'; clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }
function hash(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return 'h'+(h>>>0).toString(36); }
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; };

/* =================== NUVEM (SUPABASE) =================== */
const SUPA_URL = 'https://mbawtdnxcpugkiyadxtn.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1iYXd0ZG54Y3B1Z2tpeWFkeHRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MDM1NjEsImV4cCI6MjEwMTI3OTU2MX0.5M_YbdNTpZamxs-51PRTZw4B3rnKDC1NaePWCiXnDg4';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const CLIENT_ID = Date.now().toString(36) + Math.random().toString(36).slice(2,8);
let CHANNEL = null;

function traduzErro(msg){
  msg = String(msg||'');
  if(/invalid login/i.test(msg)) return 'E-mail ou senha incorretos';
  if(/not confirmed/i.test(msg)) return 'Confirme seu e-mail antes de entrar — veja sua caixa de entrada (e o spam)';
  if(/already registered/i.test(msg)) return 'Este e-mail já está cadastrado';
  if(/at least 6/i.test(msg)) return 'A senha precisa ter pelo menos 6 caracteres';
  if(/rate limit/i.test(msg)) return 'Muitas tentativas — aguarde um minuto e tente de novo';
  if(/fetch/i.test(msg)) return 'Sem conexão com a internet';
  return 'Algo deu errado: ' + msg;
}

/* =================== ESTADO =================== */
let USER = null;         // lojista logado
let DB = null;           // dados da loja logada
let VIEW = 'pdv';
let CART = [];           // {pid, qty}
let PDV = { seller:'', pay:'Dinheiro', discount:0, received:'' };
let prodSearch = '', pdvSearch = '';

function blankDB(){ return { sellers:[], products:[], sales:[], moves:[], cash:{ open:false, openedAt:null, initial:0, entries:[], sessions:[] } }; }
async function saveDB(){
  if(!USER) return;
  DB._client = CLIENT_ID;
  const { error } = await sb.from('lojas')
    .update({ data: DB, updated_at: new Date().toISOString() })
    .eq('user_id', USER.id);
  if(error) toast('Sem conexão — a última alteração não foi salva na nuvem', true);
}

/* =================== AUTH =================== */
function setAuthTab(t){
  $('#tabLogin').classList.toggle('on', t==='login');
  $('#tabReg').classList.toggle('on', t==='reg');
  $('#authLogin').style.display = t==='login'?'block':'none';
  $('#authReg').style.display = t==='reg'?'block':'none';
}
async function doRegister(){
  const store=$('#rgStore').value.trim(), name=$('#rgName').value.trim(),
        email=$('#rgEmail').value.trim().toLowerCase(), pass=$('#rgPass').value;
  if(!store||!name||!email||pass.length<6) return toast('Preencha tudo — a senha precisa de 6+ caracteres', true);
  toast('Cadastrando…');
  const { data, error } = await sb.auth.signUp({
    email, password: pass,
    options: { data: { store_name: store, owner_name: name } }
  });
  if(error) return toast(traduzErro(error.message), true);
  if(data.session){ await afterLogin(data.session.user); toast('Loja cadastrada! Bem-vindo 🎉'); return; }
  setAuthTab('login');
  $('#liEmail').value = email;
  toast('Quase lá! Enviamos um link de confirmação para '+email+'. Confirme e depois entre aqui.');
}
async function doLogin(){
  const email=$('#liEmail').value.trim().toLowerCase(), pass=$('#liPass').value;
  if(!email||!pass) return toast('Informe e-mail e senha', true);
  toast('Entrando…');
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error) return toast(traduzErro(error.message), true);
  await afterLogin(data.user);
  toast('Bem-vindo de volta!');
}
async function afterLogin(user){
  USER = {
    id: user.id, email: user.email,
    store: (user.user_metadata && user.user_metadata.store_name) || 'Minha loja',
    name: (user.user_metadata && user.user_metadata.owner_name) || ''
  };
  const { data: row } = await sb.from('lojas').select('store_name,data').eq('user_id', user.id).maybeSingle();
  if(row && row.data){
    DB = row.data;
    if(row.store_name) USER.store = row.store_name;
  } else {
    DB = blankDB();
    if(USER.name) DB.sellers.push({ id: uid(), name: USER.name });
    DB._client = CLIENT_ID;
    const { error } = await sb.from('lojas').insert({ user_id: user.id, store_name: USER.store, data: DB });
    if(error) toast('Não consegui criar os dados da loja: '+traduzErro(error.message), true);
  }
  enterApp();
  subscribeRealtime(user.id);
}
function subscribeRealtime(uid_){
  if(CHANNEL){ sb.removeChannel(CHANNEL); CHANNEL = null; }
  CHANNEL = sb.channel('loja-'+uid_)
    .on('postgres_changes',
      { event:'UPDATE', schema:'public', table:'lojas', filter:'user_id=eq.'+uid_ },
      payload => {
        const d = payload.new && payload.new.data;
        if(!d || d._client === CLIENT_ID) return;
        DB = d;
        render();
        toast('🔄 Atualizado em outro aparelho');
      })
    .subscribe();
}
async function logout(){
  if(CHANNEL){ sb.removeChannel(CHANNEL); CHANNEL = null; }
  await sb.auth.signOut();
  USER=null; DB=null; CART=[];
  $('#app').style.display='none'; $('#authScreen').style.display='flex';
}
function enterApp(){
  $('#authScreen').style.display='none'; $('#app').style.display='block';
  $('#sideStore').textContent = USER.store;
  go('pdv');
}

function cartTotal(){
  let sub=0; CART.forEach(c=>{ const p=DB.products.find(x=>x.id===c.pid); if(p) sub+=p.price*c.qty; });
  const disc = Math.min(num(PDV.discount), sub);
  return { sub, disc, total: sub-disc };
}
function updateFab(){
  const n = CART.reduce((a,c)=>a+c.qty,0);
  $('#fabCount').textContent = n;
  $('#cartFab').classList.toggle('has', VIEW==='pdv' && n>0);
}
function viewPDV(){

    ${!cash.open?`<button class="btn sm cyan" onclick="go('caixa')">Abrir caixa</button>`:''}

function prodCardsHTML(prods){

function refreshProdGrid(){

function cartHTML(){
  const t = cartTotal();
  const sellers = DB.sellers;
  return `
    <h3 style="font-size:17px">Carrinho</h3>
    <label>Vendedor(a)</label>
    <select onchange="PDV.seller=this.value">
      <option value="">Selecione…</option>
      ${sellers.map(s=>`<option value="${s.id}" ${PDV.seller===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
    </select>
    <div class="cartItems">
      ${CART.length===0?'<div class="empty" style="padding:18px">Toque nos produtos para adicionar</div>':
        CART.map(c=>{ const p=DB.products.find(x=>x.id===c.pid); if(!p) return '';
          return `<div class="cartItem">
            <div class="inf"><div class="nm">${esc(p.name)}</div><div class="un">${fmt(p.price)} un.</div></div>
            <div class="qtyCtl">
              <button onclick="chQty('${p.id}',-1)">−</button><span>${c.qty}</span><button onclick="chQty('${p.id}',1)">+</button>
            </div>
            <div class="money" style="min-width:70px; text-align:right">${fmt(p.price*c.qty)}</div>
          </div>`; }).join('')}
    </div>
    <label>Forma de pagamento</label>
    <div class="payGrid">
      ${['Dinheiro','Pix','Débito','Crédito'].map(f=>`<button class="payBtn ${PDV.pay===f?'on':''}" onclick="PDV.pay='${f}'; refreshCart()">${f}</button>`).join('')}
    </div>
    <label>Desconto (R$)</label>
    <input type="number" min="0" step="0.01" value="${PDV.discount||''}" placeholder="0,00" oninput="PDV.discount=this.value; refreshCartTotals()">
    ${PDV.pay==='Dinheiro'?`<label>Valor recebido (R$)</label>
    <input type="number" min="0" step="0.01" value="${PDV.received}" placeholder="0,00" oninput="PDV.received=this.value; refreshCartTotals()">`:''}
    <div id="cartTotals">${cartTotalsHTML()}</div>
    <div style="height:12px"></div>
    <button class="btn block" ${CART.length===0?'disabled':''} onclick="finishSale()">Finalizar venda • ${fmt(t.total)}</button>
  `;
}
function cartTotalsHTML(){
  const t = cartTotal();
  const rec = num(PDV.received);
  const troco = PDV.pay==='Dinheiro' && rec>0 ? rec - t.total : null;
  return `
    <div class="totRow"><span class="muted">Subtotal</span><span class="money">${fmt(t.sub)}</span></div>
    ${t.disc>0?`<div class="totRow"><span class="muted">Desconto</span><span class="money" style="color:var(--amber)">− ${fmt(t.disc)}</span></div>`:''}
    <div class="totRow big"><span>Total</span><span class="money" style="color:var(--lime)">${fmt(t.total)}</span></div>
    ${troco!==null?`<div class="totRow"><span class="muted">Troco</span><span class="money" style="color:${troco<0?'var(--red)':'var(--cyan)'}">${fmt(troco)}</span></div>`:''}
  `;
}
function refreshCart(){
  const p = $('#cartPanel'); if(p) p.innerHTML = cartHTML();
  const mb = $('#modalCartInner'); if(mb) mb.innerHTML = cartHTML();
  updateFab();
}
function refreshCartTotals(){
  document.querySelectorAll('#cartTotals').forEach(el=>el.innerHTML=cartTotalsHTML());
  const t = cartTotal();
  document.querySelectorAll('.btn.block[onclick="finishSale()"]').forEach(b=>b.innerHTML='Finalizar venda • '+fmt(t.total));
}
function addCart(pid){
  const p = DB.products.find(x=>x.id===pid);
  if(!p) return;
  const item = CART.find(c=>c.pid===pid);
  const inCart = item?item.qty:0;
  if(inCart+1 > p.stock) return toast('Estoque insuficiente de "'+p.name+'"', true);
  if(item) item.qty++; else CART.push({pid, qty:1});
  refreshCart();
}
function chQty(pid, d){
  const item = CART.find(c=>c.pid===pid); if(!item) return;
  const p = DB.products.find(x=>x.id===pid);
  if(d>0 && item.qty+1>p.stock) return toast('Estoque insuficiente', true);
  item.qty += d;
  if(item.qty<=0) CART = CART.filter(c=>c.pid!==pid);
  refreshCart();
}
function openCartModal(){
  openModal(`<div id="modalCartInner">${cartHTML()}</div>`);
}
async function finishSale(){
  if(!DB.cash.open){ toast('Abra o caixa antes de vender', true); return go('caixa'); }
  if(!PDV.seller) return toast('Selecione o vendedor(a)', true);
  if(CART.length===0) return;
  const t = cartTotal();
  if(PDV.pay==='Dinheiro' && num(PDV.received)>0 && num(PDV.received)<t.total) return toast('Valor recebido é menor que o total', true);
  const items = CART.map(c=>{ const p=DB.products.find(x=>x.id===c.pid); return {pid:p.id, name:p.name, price:p.price, qty:c.qty}; });
  // baixa no estoque + movimentação
  for(const it of items){
    const p = DB.products.find(x=>x.id===it.pid);
    p.stock -= it.qty;
    DB.moves.unshift({ id:uid(), at:Date.now(), pid:p.id, name:p.name, type:'saida', qty:it.qty, note:'Venda' });
  }
  const seller = DB.sellers.find(s=>s.id===PDV.seller);
  const sale = {
    id:uid(), at:Date.now(), sellerId:PDV.seller, sellerName:seller?seller.name:'—',
    items, subtotal:t.sub, discount:t.disc, total:t.total, payment:PDV.pay,
    received: PDV.pay==='Dinheiro'?num(PDV.received)||t.total:t.total,
    change: PDV.pay==='Dinheiro'&&num(PDV.received)>0?num(PDV.received)-t.total:0
  };
  DB.sales.unshift(sale);
  await saveDB();
  const troco = sale.change;
  CART=[]; PDV.discount=0; PDV.received='';
  closeModal(); render();
  toast('Venda concluída! '+fmt(sale.total)+(troco>0?' • Troco: '+fmt(troco):''));
}

async function saveProd(id){
  const name=$('#pfName').value.trim(), price=num($('#pfPrice').value);
  if(!name||price<=0) return toast('Informe nome e preço de venda', true);
  if(id){
    const p = DB.products.find(x=>x.id===id);
    Object.assign(p,{ name, cat:$('#pfCat').value, code:$('#pfCode').value.trim(), cost:num($('#pfCost').value), price, min:num($('#pfMin').value) });
  } else {
    const stock = Math.max(0, Math.round(num($('#pfStock').value)));
    const p = { id:uid(), name, cat:$('#pfCat').value, code:$('#pfCode').value.trim(), cost:num($('#pfCost').value), price, stock, min:num($('#pfMin').value)||3 };
    DB.products.push(p);
    if(stock>0) DB.moves.unshift({ id:uid(), at:Date.now(), pid:p.id, name, type:'entrada', qty:stock, note:'Estoque inicial' });
  }
  await saveDB(); closeModal(); render(); toast(id?'Produto atualizado':'Produto cadastrado');
}
async function delProd(id){
  if(!confirm('Excluir este produto? As vendas antigas continuam no histórico.')) return;
  DB.products = DB.products.filter(p=>p.id!==id);
  await saveDB(); closeModal(); render(); toast('Produto excluído');

async function saveMove(id){
  const p = DB.products.find(x=>x.id===id);
  const tipo = $('#mvEnt').classList.contains('on')?'entrada':'saida';
  const q = Math.round(num($('#mvQty').value));
  if(q<=0) return toast('Informe a quantidade', true);
  if(tipo==='saida' && q>p.stock) return toast('Saída maior que o estoque atual', true);
  p.stock += tipo==='entrada'?q:-q;
  DB.moves.unshift({ id:uid(), at:Date.now(), pid:p.id, name:p.name, type:tipo, qty:q, note:$('#mvNote').value.trim() });
  await saveDB(); closeModal(); render(); toast('Movimentação registrada');
}

/* =================== CAIXA =================== */
function cashSummary(){
  const c = DB.cash;
  if(!c.open) return null;
  const sales = DB.sales.filter(s=>s.at>=c.openedAt);
  const byPay = {};
  let totVendas=0;
  sales.forEach(s=>{ byPay[s.payment]=(byPay[s.payment]||0)+s.total; totVendas+=s.total; });
  const supr = c.entries.filter(e=>e.type==='suprimento').reduce((a,e)=>a+e.value,0);
  const sang = c.entries.filter(e=>e.type==='sangria').reduce((a,e)=>a+e.value,0);
  const dinheiroVendas = byPay['Dinheiro']||0;
  const emCaixa = c.initial + dinheiroVendas + supr - sang;
  return { sales, byPay, totVendas, supr, sang, dinheiroVendas, emCaixa, qtd:sales.length };
}

}
async function openCash(){
  DB.cash.open = true; DB.cash.openedAt = Date.now();
  DB.cash.initial = num($('#cxInit').value); DB.cash.entries = [];
  await saveDB(); render(); toast('Caixa aberto! Boas vendas 💚');
}
function openCashMove(type){
  openModal(`
    <h3>${type==='suprimento'?'Suprimento (entrada de dinheiro)':'Sangria (retirada de dinheiro)'}</h3>
    <label>Valor (R$)</label><input id="cmVal" type="number" step="0.01" placeholder="0,00">
    <label>Motivo</label><input id="cmNote" placeholder="${type==='suprimento'?'Ex.: reforço de troco':'Ex.: depósito no banco, pagamento fornecedor'}">
    <div style="height:16px"></div>
    <button class="btn block ${type==='suprimento'?'cyan':''}" onclick="saveCashMove('${type}')">Registrar ${type}</button>
  `);
}
async function saveCashMove(type){
  const v = num($('#cmVal').value);
  if(v<=0) return toast('Informe o valor', true);
  const s = cashSummary();
  if(type==='sangria' && v>s.emCaixa) return toast('Valor maior que o dinheiro em caixa ('+fmt(s.emCaixa)+')', true);
  DB.cash.entries.push({ type, value:v, note:$('#cmNote').value.trim(), at:Date.now() });
  await saveDB(); closeModal(); render(); toast(type==='suprimento'?'Suprimento registrado':'Sangria registrada');
}
function closeCashConfirm(){
  const s = cashSummary();
  openModal(`
    <h3>Fechar caixa</h3>
    <p class="muted" style="font-size:13.5px; margin-bottom:8px">Confira o resumo antes de confirmar:</p>
    <div class="totRow"><span class="muted">Fundo inicial</span><span class="money">${fmt(DB.cash.initial)}</span></div>
    <div class="totRow"><span class="muted">Vendas em dinheiro</span><span class="money">${fmt(s.dinheiroVendas)}</span></div>
    <div class="totRow"><span class="muted">Suprimentos</span><span class="money">${fmt(s.supr)}</span></div>
    <div class="totRow"><span class="muted">Sangrias</span><span class="money">− ${fmt(s.sang)}</span></div>
    <div class="totRow big"><span>Dinheiro esperado em caixa</span><span class="money" style="color:var(--cyan)">${fmt(s.emCaixa)}</span></div>
    <div class="totRow"><span class="muted">Total geral de vendas (todas as formas)</span><span class="money" style="color:var(--lime)">${fmt(s.totVendas)}</span></div>
    <div style="height:16px"></div>
    <button class="btn block" onclick="doCloseCash()">Confirmar fechamento</button>
  `);
}
async function doCloseCash(){
  const s = cashSummary();
  DB.cash.sessions.unshift({
    openedAt:DB.cash.openedAt, closedAt:Date.now(), initial:DB.cash.initial,
    totVendas:s.totVendas, emCaixa:s.emCaixa, sang:s.sang, supr:s.supr, qtd:s.qtd, byPay:s.byPay
  });
  DB.cash.open=false; DB.cash.openedAt=null; DB.cash.initial=0; DB.cash.entries=[];
  await saveDB(); closeModal(); render(); toast('Caixa fechado. Até a próxima!');
}

/* =================== VENDEDORES =================== */
function viewVendedores(){
  return `
  <div class="pageHead"><div><h2>Vendedores</h2><div class="sub">Equipe da ${esc(USER.store)}</div></div>
    <button class="btn sm" onclick="openSellerForm()">+ Adicionar</button></div>
  <div class="card" style="padding:6px 16px">
    ${DB.sellers.length===0?'<div class="empty"><div class="big">🧑‍💼</div>Cadastre os vendedores da loja</div>':
      DB.sellers.map(s=>{
        const vendas = DB.sales.filter(x=>x.sellerId===s.id);
        const tot = vendas.reduce((a,v)=>a+v.total,0);
        return `<div class="listRow">
          <div class="inf"><div class="nm">${esc(s.name)}</div><div class="sb">${vendas.length} venda(s) • total ${fmt(tot)}</div></div>
          <button class="btn sm ghost" onclick="openSellerForm('${s.id}')">Editar</button>
        </div>`; }).join('')}
  </div>`;
}
function openSellerForm(id){
  const s = id ? DB.sellers.find(x=>x.id===id) : null;
  openModal(`
    <h3>${s?'Editar vendedor(a)':'Novo vendedor(a)'}</h3>
    <label>Nome</label><input id="svName" value="${s?esc(s.name):''}" placeholder="Nome do vendedor(a)">
    <div style="height:16px"></div>
    <button class="btn block" onclick="saveSeller('${id||''}')">Salvar</button>
    ${s?`<div style="height:8px"></div><button class="btn danger block sm" onclick="delSeller('${s.id}')">Remover da equipe</button>`:''}
  `);
}
async function saveSeller(id){
  const name = $('#svName').value.trim();
  if(!name) return toast('Informe o nome', true);
  if(id){ DB.sellers.find(x=>x.id===id).name = name; }
  else DB.sellers.push({ id:uid(), name });
  await saveDB(); closeModal(); render(); toast('Equipe atualizada');
}
async function delSeller(id){
  if(!confirm('Remover este vendedor? As vendas dele permanecem no histórico.')) return;
  DB.sellers = DB.sellers.filter(s=>s.id!==id);
  await saveDB(); closeModal(); render(); toast('Vendedor removido');
}

/* =================== RELATÓRIOS =================== */
let repRange = 'hoje';
function viewRelatorios(){
  const now = new Date(); const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  let sales = DB.sales;
  if(repRange==='hoje') sales = sales.filter(s=>s.at>=start);
  else if(repRange==='7d') sales = sales.filter(s=>s.at>=Date.now()-7*864e5);
  else if(repRange==='30d') sales = sales.filter(s=>s.at>=Date.now()-30*864e5);
  const tot = sales.reduce((a,s)=>a+s.total,0);
  const itens = sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0);
  const lucro = sales.reduce((a,s)=>a + s.items.reduce((b,i)=>{
    const p = DB.products.find(x=>x.id===i.pid);
    return b + (i.price-(p?p.cost||0:0))*i.qty;
  },0) - s.discount, 0);
  const ticket = sales.length? tot/sales.length : 0;
  // top produtos
  const cnt = {};
  sales.forEach(s=>s.items.forEach(i=>{ cnt[i.name]=(cnt[i.name]||0)+i.qty; }));
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `
  <div class="pageHead"><div><h2>Relatório de vendas</h2><div class="sub">${sales.length} venda(s) no período</div></div>
    <div class="payGrid" style="margin:0; grid-template-columns:repeat(4,auto)">
      ${[['hoje','Hoje'],['7d','7 dias'],['30d','30 dias'],['tudo','Tudo']].map(([k,l])=>`<button class="payBtn ${repRange===k?'on':''}" onclick="repRange='${k}'; render()">${l}</button>`).join('')}
    </div></div>
  <div class="statGrid">
    <div class="stat lime"><div class="lb">Faturamento</div><div class="vl">${fmt(tot)}</div></div>
    <div class="stat cyan"><div class="lb">Lucro estimado</div><div class="vl">${fmt(lucro)}</div></div>
    <div class="stat"><div class="lb">Itens vendidos</div><div class="vl">${itens}</div></div>
    <div class="stat"><div class="lb">Ticket médio</div><div class="vl">${fmt(ticket)}</div></div>
  </div>
  ${top.length?`<div class="card" style="margin-bottom:14px"><h3 style="font-size:16px; margin-bottom:6px">Mais vendidos</h3>
    ${top.map(([n,q],i)=>`<div class="totRow"><span class="muted">${i+1}. ${esc(n)}</span><span class="money">${q} un.</span></div>`).join('')}</div>`:''}
  <h3 style="font-size:17px; margin-bottom:8px">Vendas</h3>
  <div class="card" style="padding:6px 16px">
    ${sales.length===0?'<div class="empty"><div class="big">🧾</div>Nenhuma venda no período</div>':
      sales.map(s=>`
      <div class="listRow" style="cursor:pointer" onclick="openSaleDetail('${s.id}')">
        <div class="inf"><div class="nm">${fmt(s.total)} • ${esc(s.payment)}</div>
        <div class="sb">${dstr(s.at)} • ${esc(s.sellerName)} • ${s.items.reduce((a,i)=>a+i.qty,0)} item(ns)</div></div>
        <span class="muted">›</span>
      </div>`).join('')}
  </div>`;
}
function openSaleDetail(id){
  const s = DB.sales.find(x=>x.id===id);
  openModal(`
    <h3>Venda — ${fmt(s.total)}</h3>
    <p class="muted" style="font-size:13px">${dstr(s.at)} • Vendedor(a): ${esc(s.sellerName)} • ${esc(s.payment)}</p>
    <div style="height:10px"></div>
    ${s.items.map(i=>`<div class="totRow"><span class="muted">${i.qty}× ${esc(i.name)}</span><span class="money">${fmt(i.price*i.qty)}</span></div>`).join('')}
    ${s.discount>0?`<div class="totRow"><span class="muted">Desconto</span><span class="money" style="color:var(--amber)">− ${fmt(s.discount)}</span></div>`:''}
    <div class="totRow big"><span>Total</span><span class="money" style="color:var(--lime)">${fmt(s.total)}</span></div>
    ${s.change>0?`<div class="totRow"><span class="muted">Recebido ${fmt(s.received)} • Troco</span><span class="money">${fmt(s.change)}</span></div>`:''}
  `);
}

function closeModal(){ $('#modalWrap').classList.remove('open'); }

    const { data:{ session } } = await sb.auth.getSession();
    if(session){ await afterLogin(session.user); return; }
  }catch(e){}
  $('#authScreen').style.display='flex';
})();
